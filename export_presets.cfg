html/head_include="<script>/* Build 015b web audio unlock: browsers (iOS Safari, Android Chrome) start the AudioContext suspended until a user gesture. Godot resumes it on its own input events; this also resumes on touchend/click (what iOS needs), plays a 1-sample silent buffer to wake WebKit, uses the iOS 'playback' audio session so the ring/silent switch doesn't mute the game, and resumes again when the tab comes back. */(function(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){return;}var ctxs=[];function W(a){var c=(a===undefined)?new AC():new AC(a);ctxs.push(c);return c;}W.prototype=AC.prototype;window.AudioContext=W;if(window.webkitAudioContext){window.webkitAudioContext=W;}try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}function unlock(){for(var i=0;i<ctxs.length;i++){var c=ctxs[i];if(c.state!=='running'){try{c.resume();var b=c.createBuffer(1,1,22050);var s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}}}}['touchstart','touchend','pointerdown','pointerup','mousedown','keydown','click'].forEach(function(ev){window.addEventListener(ev,unlock,{capture:true,passive:true});});document.addEventListener('visibilitychange',function(){if(!document.hidden){unlock();}});})();</script>"
